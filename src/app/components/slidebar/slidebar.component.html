<div
  class="sidebar"
  [class.expanded]="sidebarOpen"
  (mouseenter)="onSidebarEnter()"
  (mouseleave)="onSidebarLeave()">

  <div class="top-stripe"></div>

  <div class="menu-header">
    <div class="logo-box">
      <img src="assets/icon/logo_ieca.png" alt="IECA Logo" />
    </div>
    <div class="brand-text">
      <p>Sistema Contable</p>
      <h3>La Alborada</h3>
    </div>
    <button
      type="button"
      class="pin-btn"
      [class.pinned]="isPinned"
      (click)="togglePin(); $event.stopPropagation()"
      [attr.aria-label]="isPinned ? 'Contraer menú' : 'Fijar menú expandido'"
      [attr.title]="isPinned ? 'Contraer menú' : 'Fijar menú'">
      <ion-icon [name]="isPinned ? 'chevron-back-outline' : 'chevron-forward-outline'"></ion-icon>
    </button>
  </div>

  <nav class="nav-scroll" aria-label="Menú principal">
    <div class="nav-section">
      @for (item of menuPrincipal; track item.route) {
        <a
          href="#"
          class="nav-item"
          [class.item-active]="isRouteActive(item.route)"
          [attr.title]="!sidebarOpen ? item.label : null"
          (click)="navigateTo($event, item.route)">
          <div class="nav-icon">
            <ion-icon [name]="item.icon"></ion-icon>
            @if (item.badge && !sidebarOpen) {
              <span class="nav-badge-dot" aria-hidden="true"></span>
            }
          </div>
          <span class="nav-label">{{ item.label }}</span>
          @if (item.badge && sidebarOpen) {
            <span class="nav-badge">{{ item.badge }}</span>
          }
        </a>
      }
    </div>

    <div class="menu-divider"></div>

    <div class="nav-section">
      <div class="section-label">Sistema</div>
      @for (item of menuSistema; track item.route) {
        <a
          href="#"
          class="nav-item"
          [class.item-active]="isRouteActive(item.route)"
          [attr.title]="!sidebarOpen ? item.label : null"
          (click)="navigateTo($event, item.route)">
          <div class="nav-icon">
            <ion-icon [name]="item.icon"></ion-icon>
          </div>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </div>
  </nav>

  <div class="menu-footer">
    <a
      href="#"
      class="logout-item"
      title="Cerrar sesión"
      (click)="logout($event)">
      <div class="nav-icon">
        <ion-icon name="log-out-outline"></ion-icon>
      </div>
      <span class="nav-label">Cerrar sesión</span>
    </a>
  </div>
</div>
