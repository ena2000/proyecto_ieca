<!-- El contentId debe ser "main-content" para coincidir con el ID en app.component.html -->
<ion-menu contentId="main-content" side="start" menuId="main-menu">
  
  <ion-content>
    <div class="sidebar-content">
      
      <!-- 1. CABECERA: Logo e Identidad -->
      <div class="menu-header">
        <img src="assets/icon/logo_ieca.png" alt="IECA logo">
        <div class="brand-text">
          <p>Iglesia del Evangelio</p>
          <h3>La Alborada</h3>
        </div>
      </div>

      <!-- 2. NAVEGACIÓN: Cada item envuelto en ion-menu-toggle para que funcione el click -->
      <ion-list lines="none" class="menu-list">
        
        <!-- Dashboard -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/dashboard" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <!-- Ministerios -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/ministerios" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="business-outline"></ion-icon>
            <ion-label>Ministerios</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <!-- Ingresos -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/ingresos" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="cash-outline"></ion-icon>
            <ion-label>Ingresos</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <!-- Gastos -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/gastos" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="trending-down-outline"></ion-icon>
            <ion-label>Gastos</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <!-- Reportes -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/reportes" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="bar-chart-outline"></ion-icon>
            <ion-label>Reportes</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <!-- Usuarios -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/usuarios" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Usuarios</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <!-- Administración -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/administracion" routerLinkActive="item-active" routerDirection="root">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Administración</ion-label>
          </ion-item>
        </ion-menu-toggle>

      </ion-list>

      <div class="menu-divider"></div>

      <!-- 3. FOOTER: Perfil y Logout -->
      <div class="menu-footer">
        
        <div class="profile-card">
          <div class="profile-avatar">
            <img src="assets/icon/logo_ieca.png" alt="Usuario">
          </div>
          <div class="profile-info">
            <p class="profile-name">Contadora</p>
            <p class="profile-role">Administración IECA</p>
          </div>
          <ion-icon name="chevron-down-outline"></ion-icon>
        </div>

        <!-- Botón de Cerrar Sesión -->
        <ion-menu-toggle auto-hide="false">
          <ion-item detail="false" routerLink="/login" class="logout-item" routerDirection="root">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Cerrar Sesión</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
      </div>
    </div>
  </ion-content> 
</ion-menu>
