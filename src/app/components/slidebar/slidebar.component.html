<div class="sidebar" [class.expanded]="false">

  <!-- FRANJA SUPERIOR AMARILLA -->
  <div class="top-stripe"></div>

  <!-- HEADER / LOGO -->
  <div class="menu-header">
    <div class="logo-box">
      <img src="assets/icon/logo_ieca.png" alt="IECA Logo" />
    </div>
    <div class="brand-text">
      <p>Sistema Contable</p>
      <h3>La Alborada</h3>
    </div>
  </div>

  <!-- MENÚ PRINCIPAL -->
  <div class="nav-section">
    @for (item of menuPrincipal; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="item-active"
        class="nav-item">
        <div class="nav-icon">
          <ion-icon [name]="item.icon"></ion-icon>
        </div>
        <span class="nav-label">{{ item.label }}</span>
        @if (item.badge) {
          <span class="nav-badge">{{ item.badge }}</span>
        }
      </a>
    }
  </div>

  <!-- DIVISOR -->
  <div class="menu-divider"></div>

  <!-- MENÚ SISTEMA -->
  <div class="nav-section">
    <div class="section-label">Sistema</div>
    @for (item of menuSistema; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="item-active"
        class="nav-item">
        <div class="nav-icon">
          <ion-icon [name]="item.icon"></ion-icon>
        </div>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </div>

  <!-- ESPACIADOR -->
  <div class="menu-spacer"></div>

  <!-- FOOTER -->
  <div class="menu-footer">

    <!-- CERRAR SESIÓN -->
    <a routerLink="/login" class="logout-item">
      <div class="nav-icon">
        <ion-icon name="log-out-outline"></ion-icon>
      </div>
      <span class="nav-label">Cerrar sesión</span>
    </a>

  </div>
</div>
