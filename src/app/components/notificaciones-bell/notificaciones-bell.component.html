@if (visible) {
  <ion-buttons class="notif-toolbar-buttons">
    <ion-button
      class="text-blue notif-bell-btn"
      type="button"
      aria-label="Notificaciones"
      (click)="togglePopover($event)">
      <ion-icon name="notifications-outline"></ion-icon>
      @if (noLeidas > 0) {
        <span class="notif-bell-badge" aria-hidden="true">
          {{ noLeidas > 9 ? '9+' : noLeidas }}
        </span>
      }
    </ion-button>
  </ion-buttons>

  <ion-popover
    #notifPopover
    side="bottom"
    alignment="end"
    class="notif-popover"
    [keepContentsMounted]="true"
    (didDismiss)="onPopoverDismiss()"
    (didPresent)="onPopoverPresent()">
    <ng-template>
      <div class="notif-popover-panel">
        <div class="notif-popover__header">
          <h3>Notificaciones</h3>
          @if (noLeidas > 0) {
            <button
              type="button"
              class="notif-mark-all"
              (click)="marcarTodasLeidas($event)">
              <ion-icon name="checkmark-done-outline"></ion-icon>
              Marcar leídas
            </button>
          }
        </div>

        <div class="notif-popover__scroll" #scrollArea (wheel)="onScrollWheel($event)">
          @if (lista.length === 0) {
            <p class="notif-empty">No hay notificaciones por ahora.</p>
          } @else {
            <ion-list lines="none" class="notif-list">
              @for (n of lista; track n.id) {
                <ion-item
                  button
                  detail="false"
                  [class.notif-item--unread]="esNoLeida(n)"
                  (click)="abrirNotificacion(n, $event)">
                  <div
                    class="notif-item__icon"
                    [class.notif-item__icon--ingreso]="n.tipo === 'ingreso'"
                    [class.notif-item__icon--gasto]="n.tipo === 'gasto'"
                    [class.notif-item__icon--cierre]="n.tipo === 'cierre'"
                    slot="start">
                    <ion-icon [name]="iconoPara(n)"></ion-icon>
                  </div>
                  <ion-label>
                    <strong>{{ n.titulo }}</strong>
                    <p>{{ n.mensaje }}</p>
                    <span class="notif-time">{{ tiempo(n.fecha) }}</span>
                  </ion-label>
                </ion-item>
              }
            </ion-list>
          }
        </div>
      </div>
    </ng-template>
  </ion-popover>
}
