<ion-header class="ion-no-border">
  <ion-toolbar class="ieca-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button color="primary"></ion-menu-button>
    </ion-buttons>
    <ion-title class="main-title">Ingresos</ion-title>
    <ion-buttons slot="end">
      <ion-button class="text-blue">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding gray-bg">
  <div class="container-wrapper">

    <!-- =========================
         FORMULARIO
    ========================== -->
    <div class="page-header">
      <h1 class="text-blue">
        {{ modoEdicion ? 'Editar Ingreso' : 'Registrar Ingreso' }}
      </h1>
      <p>Completa la información para el registro contable.</p>
    </div>

    <div class="custom-card-style form-card">
      <form class="ieca-grid-form">

        <!-- FECHA -->
        <div class="input-group">
          <ion-label class="ieca-label">Fecha del Ingreso</ion-label>

          <ion-item lines="none" class="ieca-input-item">
            <ion-icon slot="start" name="calendar-outline" class="text-blue"></ion-icon>
            <ion-datetime-button datetime="date-picker-ingresos"></ion-datetime-button>
          </ion-item>

          <ion-modal [keepContentsMounted]="true" #dateModal class="date-modal">
            <ng-template>
              <ion-datetime
                id="date-picker-ingresos"
                presentation="date"
                [(ngModel)]="nuevoIngreso.fecha"
                (ionChange)="onFechaChange($event, dateModal)">
              </ion-datetime>
            </ng-template>
          </ion-modal>
        </div>

        <!-- MONTO -->
        <div class="input-group">
          <ion-label class="ieca-label">Monto ($)</ion-label>

          <ion-item lines="none" class="ieca-input-item">
            <ion-icon slot="start" name="cash-outline" class="text-green"></ion-icon>
            <ion-input
              type="number"
              [(ngModel)]="nuevoIngreso.monto"
              name="monto"
              placeholder="0.00"
              class="amount-input">
            </ion-input>
          </ion-item>
        </div>

        <!-- DESCRIPCIÓN -->
        <div class="input-group full-width">
          <ion-label class="ieca-label">Descripción</ion-label>

          <ion-item lines="none" class="ieca-input-item">
            <ion-icon slot="start" name="document-text-outline" class="text-blue"></ion-icon>
            <ion-input
              type="text"
              [(ngModel)]="nuevoIngreso.descripcion"
              name="descripcion"
              placeholder="Ej. Diezmos Semanales...">
            </ion-input>
          </ion-item>
        </div>

        <!-- FOTO -->
        <div class="input-group full-width">
          <ion-label class="ieca-label">Comprobante</ion-label>

          <div class="upload-zone">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <p>Subir imagen del comprobante</p>
            <span>JPG o PNG (Máx 5MB)</span>

            <input
              type="file"
              class="file-overlay"
              accept="image/*"
              (change)="onFileChange($event)">
          </div>
        </div>

        <!-- BOTÓN -->
        <div class="button-container full-width ion-margin-top">
          <ion-button
            type="button"
            expand="block"
            class="ieca-registro-button"
            (click)="registrarIngreso()">

            <ion-icon name="save-outline"></ion-icon>
            <span>
              {{ modoEdicion ? 'Actualizar' : 'Registrar' }}
            </span>

          </ion-button>
        </div>

      </form>
    </div>

    <!-- =========================
         LISTA
    ========================== -->
    <div class="list-section-header">
      <h2 class="text-blue">Lista de Ingresos</h2>

      <div class="header-actions">
        <ion-searchbar
          placeholder="Buscar ingreso..."
          class="custom-search">
        </ion-searchbar>

        <ion-button fill="outline" class="filter-btn">
          <ion-icon slot="icon-only" name="filter-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- TABLA -->
    <app-tabla-general
      [columns]="columnsIngresos"
      [data]="listaIngresos"
      [actions]="acciones"
      (onEdit)="editarIngreso($event)"
      (onDelete)="eliminarIngreso($event)">
    </app-tabla-general>

  </div>
</ion-content>
