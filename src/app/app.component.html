<ion-app>
  @if (mostrarMenu) {
    <!-- El 'when="lg"' significa que el menú se queda fijo en pantallas grandes -->
    <ion-split-pane when="lg" contentId="main-content">
      
      <app-slidebar></app-slidebar>

      <!-- Usamos ion-router-outlet directamente con el ID -->
      <ion-router-outlet id="main-content"></ion-router-outlet>

    </ion-split-pane>
  } 
  @else {
    <!-- Pantalla completa para Login -->
    <ion-router-outlet></ion-router-outlet>
  }
</ion-app>
