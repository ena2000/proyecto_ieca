<ion-content [fullscreen]="true">
  <div class="login-wrapper">
    <div class="bg-circle blue"></div>
    <div class="bg-circle purple"></div>

    <div class="login-container">
      <div class="login-card">

        <div class="header-section">
          <div class="logo-box">
            <img src="assets/icon/logo_ieca2.png" alt="Logo IECA">
          </div>
          <h1 class="main-title">
            Cambio de<br>
            <span class="highlight">Contraseña</span><br>
            <span class="sub-name">Obligatorio</span>
          </h1>
          <p class="hint">
            Por seguridad, debes actualizar tu contraseña antes de continuar.
            {{ passwordHint }}.
          </p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="form-content">
          <label class="input-label">Contraseña actual</label>
          <ion-item lines="none" class="modern-input password-item">
            <ion-input
              #oldPasswordInput
              formControlName="oldPassword"
              [type]="showOld ? 'text' : 'password'"
              placeholder="••••••••">
            </ion-input>
            <ion-button
              fill="clear"
              slot="end"
              type="button"
              class="custom-eye-btn"
              (click)="showOld = !showOld">
              <ion-icon slot="icon-only" [name]="showOld ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>

          <label class="input-label">Nueva contraseña</label>
          <ion-item lines="none" class="modern-input password-item">
            <ion-input
              #newPasswordInput
              formControlName="newPassword"
              [type]="showNew ? 'text' : 'password'"
              [placeholder]="passwordHint">
            </ion-input>
            <ion-button
              fill="clear"
              slot="end"
              type="button"
              class="custom-eye-btn"
              (click)="showNew = !showNew">
              <ion-icon slot="icon-only" [name]="showNew ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>

          <label class="input-label" [class.text-danger]="mismatch">Confirmar nueva contraseña</label>
          <ion-item lines="none" class="modern-input password-item" [class.input-error]="mismatch">
            <ion-input
              #confirmPasswordInput
              formControlName="confirmPassword"
              [type]="showConfirm ? 'text' : 'password'"
              placeholder="Repite la nueva contraseña">
            </ion-input>
            <ion-button
              fill="clear"
              slot="end"
              type="button"
              class="custom-eye-btn"
              (click)="showConfirm = !showConfirm">
              <ion-icon slot="icon-only" [name]="showConfirm ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>

          <small class="field-error" *ngIf="mismatch">
            Las contraseñas no coinciden.
          </small>

          @if (formGuardadoError) {
            <div class="form-validation-error" role="alert">
              <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
              <span>{{ formGuardadoError }}</span>
            </div>
          }

          <ion-button
            expand="block"
            type="submit"
            class="submit-btn"
            [disabled]="guardando">
            {{ guardando ? 'Guardando…' : 'Guardar y continuar' }}
            <ion-icon slot="end" name="arrow-forward-circle"></ion-icon>
          </ion-button>
        </form>

        <div class="footer-info">
          <span class="badge">Seguridad IECA</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
