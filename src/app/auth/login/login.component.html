<ion-content [fullscreen]="true">
  <div class="login-container">
    <div class="login-card">
      
      <div class="header-section">
        <div class="logo-container">
          <img src="assets/icon/logo_ieca2.png" alt="Logo IECA">
        </div>
        <h1>Iglesia del Evangelio<br>Cuadrangular<br>“La Alborada”</h1>
      </div>

      <div class="form-section">
        <ion-item lines="none" class="custom-input">
          <ion-icon slot="start" name="person-outline"></ion-icon>
          <ion-input type="text" placeholder="Usuario"></ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-input">
          <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
          <ion-input type="password" placeholder="Contraseña"></ion-input>
        </ion-item>

        <ion-button expand="block" class="login-button" routerLink="/dashboard">
          Iniciar sesión
        </ion-button>

        <div class="footer-links">
          <p>¿Olvidaste tu contraseña?</p>
        </div>
      </div>

    </div>
  </div>
</ion-content>
