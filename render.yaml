# Blueprint Render — API IECA
# https://render.com/docs/blueprint-spec
#
# Conecta el repo en Render → New → Blueprint y ajusta las variables marcadas como sync: false.

services:
  - type: web
    name: ieca-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
