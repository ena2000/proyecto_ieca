# Blueprint Render — API IECA
# https://render.com/docs/blueprint-spec
#
# Render → New → Blueprint → conecta el repo GitHub.
# Completa en el panel las variables marcadas sync: false.

services:
  - type: web
    name: ieca-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ALERTAS_EMAIL_ENABLED
        value: "true"
      - key: ALERTAS_CRON_ENABLED
        value: "true"
      - key: ALERTAS_HORAS_PENDIENTE
        value: "48"
      - key: ALERTAS_DIAS_CIERRE
        value: "5"
