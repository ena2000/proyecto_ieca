# Resumen operativo por email (pendientes + cierre mensual)
name: Alertas email

on:
  schedule:
    # 14:00 UTC ≈ 08:00 Guatemala (CST)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  enviar-resumen:
    name: Enviar resumen IECA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Credenciales Firebase
        working-directory: server
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Enviar alertas
        working-directory: server
        run: npm run alertas
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERTAS_EMAIL_ENABLED: 'true'
