# Genera artefactos listos para desplegar (frontend www/ + API server/).
# Requiere que CI haya pasado en la misma rama o ejecución manual.
name: Release build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  ci-gate:
    name: Verificar CI previo (solo en push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Esperar workflow CI
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const maxWait = 20 * 60 * 1000;
            const start = Date.now();
            while (Date.now() - start < maxWait) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: sha,
                event: 'push',
                per_page: 20
              });
              const ci = runs.data.workflow_runs.find(r => r.name === 'CI');
              if (ci) {
                if (ci.conclusion === 'success') return;
                if (['failure', 'cancelled', 'timed_out'].includes(ci.conclusion)) {
                  core.setFailed(`CI terminó con: ${ci.conclusion}`);
                  return;
                }
              }
              await new Promise(r => setTimeout(r, 15000));
            }
            core.setFailed('Timeout esperando CI');
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    name: Build artefactos de despliegue
    runs-on: ubuntu-latest
    needs: [ci-gate]
    if: always() && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build:ci

      - name: Empaquetar frontend
        run: |
          cd www
          tar -czf ../ieca-frontend-www.tar.gz .

      - name: Preparar API (sin node_modules)
        working-directory: server
        run: |
          npm ci
          npm run build
          npm ci --omit=dev
          tar -czf ../ieca-server.tar.gz \
            package.json package-lock.json dist scripts .env.example \
            node_modules

      - name: Subir artefacto frontend
        uses: actions/upload-artifact@v4
        with:
          name: ieca-frontend-www
          path: ieca-frontend-www.tar.gz
          retention-days: 30

      - name: Subir artefacto API
        uses: actions/upload-artifact@v4
        with:
          name: ieca-server
          path: ieca-server.tar.gz
          retention-days: 30

      - name: Resumen
        run: |
          echo "## Artefactos generados" >> $GITHUB_STEP_SUMMARY
          echo "- **ieca-frontend-www**: contenido estático para hosting (Firebase, Nginx, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- **ieca-server**: API Node con dependencias de producción" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Guía de despliegue: [docs/DEPLOY.md](docs/DEPLOY.md)" >> $GITHUB_STEP_SUMMARY
