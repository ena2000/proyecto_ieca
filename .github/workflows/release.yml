# Genera artefactos listos para desplegar (frontend www/ + API server/).
# Se ejecuta automáticamente cuando CI termina en main/master, o manualmente.
name: Release build

on:
  # Disparador principal: CI terminó (evita carrera con el push)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  # Manual desde Actions → Release build → Run workflow
  workflow_dispatch:
  # Tags de versión (sin esperar CI; publica desde el commit del tag)
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    name: Verificar CI previo
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: CI exitoso o ejecución manual
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "CI exitoso en commit ${{ github.event.workflow_run.head_sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Ejecución manual — asegúrate de que CI esté verde en esta rama."
          else
            echo "Release por tag ${{ github.ref_name }}"
          fi

  ci-not-green:
    name: CI no exitoso — release cancelado
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Fallar con mensaje claro
        run: |
          echo "::error::CI terminó con '${{ github.event.workflow_run.conclusion }}'. Corrige CI antes del release."
          exit 1

  build-artifacts:
    name: Build artefactos de despliegue
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.result == 'success'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build:ci

      - name: Empaquetar frontend
        run: |
          cd www
          tar -czf ../ieca-frontend-www.tar.gz .

      - name: Preparar API
        working-directory: server
        run: |
          npm ci
          npm run build
          npm ci --omit=dev
          tar -czf ../ieca-server.tar.gz \
            package.json package-lock.json dist scripts .env.example ecosystem.config.cjs \
            node_modules

      - name: Subir artefacto frontend
        uses: actions/upload-artifact@v4
        with:
          name: ieca-frontend-www
          path: ieca-frontend-www.tar.gz
          retention-days: 30

      - name: Subir artefacto API
        uses: actions/upload-artifact@v4
        with:
          name: ieca-server
          path: ieca-server.tar.gz
          retention-days: 30

      - name: Resumen
        run: |
          echo "## Artefactos generados" >> $GITHUB_STEP_SUMMARY
          echo "- **ieca-frontend-www**: contenido estático para hosting (Firebase, Nginx, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- **ieca-server**: API compilada (\`dist/\`) con dependencias de producción" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Guía de despliegue: [docs/DEPLOY.md](docs/DEPLOY.md)" >> $GITHUB_STEP_SUMMARY
