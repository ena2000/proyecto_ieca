# Legacy: solo hacía falta en plan Free (servicio que se duerme).
# Producción IECA usa plan Starter (render.yaml) — siempre activo, sin cold start.
# Cron desactivado; queda workflow_dispatch por si se baja de plan.
name: Keep Render warm

on:
  workflow_dispatch:

jobs:
  ping:
    name: Ping ieca-api health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: curl -fsS -m 45 "https://ieca-api.onrender.com/api/health"
